{% load static %}<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acceso administrador | POA Institucional</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="{% static 'dashboard/app.css' %}" />
    <style>
      .login-wrap { max-width: 420px; margin: 8vh auto; padding: 0 20px; }
      .login-wrap label { display: block; font-weight: 600; margin: 14px 0 6px; }
      .login-wrap input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #d6dbe4; font: inherit; }
      .login-wrap .btn { margin-top: 18px; width: 100%; text-align: center; border: 0; cursor: pointer; }
      .alerta { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #fdeaea; color: #8f1d1d; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <div class="panel">
        <h1 style="margin-top: 0">Panel administrador</h1>
        <p style="color: #5b6472">Ingresa con tu cuenta de administrador para actualizar los datos del POA.</p>
        <form method="post">
          {% csrf_token %}
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button class="btn" type="submit">Entrar</button>
        </form>
        {% if error %}<p class="alerta">{{ error }}</p>{% endif %}
        <p style="margin-top: 18px"><a href="{% url 'index' %}">← Volver al dashboard</a></p>
      </div>
    </main>
  </body>
</html>
